<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Push Live - Raison d'Être</title>
    <link rel="icon" type="image/png" href="brand/RE-cursor-blue.png">
    <style>
        @font-face {
            font-family: 'Apercu Pro Bold';
            src: url('fonts/Apercu Pro Font/apercu_bold_pro.otf') format('opentype');
            font-weight: bold;
            font-style: normal;
        }

        @font-face {
            font-family: 'Apercu Pro Medium';
            src: url('fonts/Apercu Pro Font/apercu_medium_pro.otf') format('opentype');
            font-weight: 500;
            font-style: normal;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            cursor: url('brand/RE-cursor-white-24.png') 12 12, auto;
        }

        body {
            font-family: 'Apercu Pro Medium', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #0000FF;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        /* Logo at the top */
        .logo-container {
            position: absolute;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
        }

        .logo {
            height: 80px;
            width: auto;
        }

        /* Main content container */
        .main-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0;
            z-index: 5;
        }

        /* Push Live Button */
        .push-live-button {
            background: white;
            color: #0000FF;
            border: none;
            padding: 28px 80px;
            font-size: 42px;
            font-family: 'Apercu Pro Bold', sans-serif;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 60px;
            cursor: url('brand/RE-cursor-white-24.png') 12 12, pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
        }

        .push-live-button::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(0, 0, 255, 0.1);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .push-live-button:hover {
            transform: scale(1.05);
            box-shadow: 0 15px 60px rgba(0, 0, 0, 0.4);
        }

        .push-live-button:hover::before {
            width: 300%;
            height: 300%;
        }

        .push-live-button:active {
            transform: scale(0.98);
        }

        /* Sparkle animation */
        @keyframes sparkle {
            0%, 100% { opacity: 0; transform: scale(0) rotate(0deg); }
            50% { opacity: 1; transform: scale(1) rotate(180deg); }
        }

        .sparkle {
            position: absolute;
            font-size: 24px;
            pointer-events: none;
            animation: sparkle 1s ease-in-out infinite;
        }

        .sparkle:nth-child(1) { top: -30px; left: -30px; animation-delay: 0s; }
        .sparkle:nth-child(2) { top: -30px; right: -30px; animation-delay: 0.2s; }
        .sparkle:nth-child(3) { bottom: -30px; left: -30px; animation-delay: 0.4s; }
        .sparkle:nth-child(4) { bottom: -30px; right: -30px; animation-delay: 0.6s; }

        /* Button container for sparkles */
        .button-container {
            position: relative;
            display: inline-block;
        }

        /* Floating animation for the whole content */
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
        }

        .main-content {
            animation: float 3s ease-in-out infinite;
        }

        /* Fade in animation */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo-container {
            animation: fadeIn 0.8s ease-out;
        }

        .button-container {
            animation: fadeIn 1s ease-out 0.3s backwards;
        }

        /* Mobile responsiveness */
        @media (max-width: 768px) {
            .logo {
                height: 60px;
            }

            .logo-container {
                top: 30px;
            }

            .push-live-button {
                padding: 22px 60px;
                font-size: 32px;
                border-radius: 50px;
            }

            .sparkle {
                font-size: 18px;
            }
        }

        @media (max-width: 480px) {
            .logo {
                height: 50px;
            }

            .logo-container {
                top: 25px;
            }

            .push-live-button {
                padding: 18px 45px;
                font-size: 26px;
                border-radius: 40px;
            }

            .sparkle {
                font-size: 16px;
            }
        }
    </style>
    <script>
        window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
    <!-- Logo at top -->
    <div class="logo-container">
        <img src="brand/RE-logo-text-white.png" alt="Raison d'Être" class="logo">
    </div>

    <!-- Main content with button -->
    <div class="main-content">
        <div class="button-container">
            <span class="sparkle">✨</span>
            <span class="sparkle">✨</span>
            <span class="sparkle">✨</span>
            <span class="sparkle">✨</span>
            <button class="push-live-button" onclick="handlePushLive()">
                Push Live!
            </button>
        </div>
    </div>

    <script>
        function handlePushLive() {
            const button = document.querySelector('.push-live-button');

            // Add a fun animation
            button.style.transform = 'scale(0.95)';
            setTimeout(() => {
                button.style.transform = 'scale(1.05)';
            }, 100);

            // You can add your deployment logic here
            console.log('Pushing live! 🚀');

            // Example: redirect or trigger deployment
            // window.location.href = 'your-deployment-url';
            alert('Ready to push live! 🚀💙');
        }
    </script>
</body>
</html>
